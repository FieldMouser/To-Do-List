<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список задач</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div class="taskListsDiv">
        <h1>Мои списки задач:</h1>

        <div class="newList">
            <button class="addList" onclick="callListAdding()">Создать список задач</button>
        </div>

        <div class="listDiv">
            <h1>Название списка задач:</h1>
            <ul class="list">
                <li>Задача 1 <button>Выполнено</button> <button>Удалить</button></li>
            </ul>

            <div class="newToDo">
                <button class="addToDo" onclick="callAdding()">Добавить задачу</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
